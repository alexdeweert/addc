<div class="site-shell">
  <header class="site-header">
    <h1 class="site-title">
      <a class="identity" routerLink="/" aria-label="Alex Deweert, homepage">
        <span>ALEX DEWEERT</span>
        <span class="identity-suffix">— DEVELOPER</span>
      </a>
    </h1>

    <button
      class="theme-toggle"
      type="button"
      [attr.aria-label]="'Switch to ' + themeAction().toLowerCase()"
      (click)="toggleTheme()"
    >
      @if (theme() === 'dark') {
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3.5" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"
          />
        </svg>
      } @else {
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M20.5 15.1A8.5 8.5 0 0 1 8.9 3.5a8.5 8.5 0 1 0 11.6 11.6Z" />
        </svg>
      }
    </button>
  </header>

  <main>
    <router-outlet />
  </main>

  <footer>
    <span>© 2026 Alex Deweert</span>
    <a href="https://github.com/alexdeweert">GitHub</a>
  </footer>
</div>
