<article>
  <span class="article-meta">
    <span class="article-date">{{ article().date }}</span>
    @if (article().pinned) {
      <span class="article-pinned">Pinned</span>
    }
  </span>
  @if (article().href; as href) {
    <a class="article-link" [href]="href" target="_blank" rel="noopener noreferrer">
      <strong>{{ article().header }}</strong>
      <p>{{ article().summary }}</p>
    </a>
  } @else if (article().route; as route) {
    <a class="article-link" [routerLink]="route">
      <strong>{{ article().header }}</strong>
      <p>{{ article().summary }}</p>
    </a>
  }
</article>
